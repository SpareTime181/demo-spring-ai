spring:
  application:
    name: demo-spring-ai
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: deepseek-r1:14b
    openai:
      base-url: https://ws-q11mhfcx8cg6t4j2.cn-beijing.maas.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3.8-max
